name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx turbo lint
      - run: npx tsc --noEmit --project apps/api/tsconfig.json
      - run: npx tsc --noEmit --project apps/web/tsconfig.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx turbo build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx turbo test

  route-contract:
    name: Route Contract (API <-> Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: API route contract (records every versioned route + auth)
        run: npm test --workspace @savitools/api -- api-contract

      - name: Web route contract (wrappers, hygiene and smoke flows)
        run: npm test --workspace @savitools/web -- api-contract

  docker-build:
    name: Docker Build (API)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t savitools-api:latest -f apps/api/Dockerfile .

  docker-compose-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provide the values Compose interpolates. DEPLOYER_SECRET_KEY is a
      # throwaway testnet key: the api container is never started here, the
      # value only has to satisfy the ${DEPLOYER_SECRET_KEY:?} guard.
      - name: Create .env for Compose
        run: |
          cp .env.example .env
          echo "DEPLOYER_SECRET_KEY=SDJNQ4TZWJ4RJZ6F3ZWQ4TZWJ4RJZ6F3ZWQ4TZWJ4RJZ6F3ZWQ4TZ" >> .env

      - name: Validate both compose files
        run: make config

      # Smoke run: the infrastructure services must actually reach a healthy
      # state, not merely parse.
      - name: Smoke run infrastructure
        run: |
          docker compose -f docker-compose.yml up -d --wait
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml down -v
